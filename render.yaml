# Render Blueprint — backend API (https://render.com/docs/blueprint-spec)
# Render → New → Blueprint → pick this repo. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: aivs-cafe-api
    runtime: node
    region: singapore
    plan: free # free instances sleep after ~15 min idle; "starter" stays awake (recommended for the POS)
    rootDir: BACKEND
    buildCommand: npm ci --include=dev && npm run build
    # Apply pending migrations, then start the API.
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://aivs-cafe.vercel.app
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: BUSINESS_TIMEZONE
        value: Asia/Manila
